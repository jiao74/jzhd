<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就職活動明細</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
    --text:#182230;
    --muted:#7b8797;
    --line:#e7ebf0;
    --accent:#2f6fed;
    --accent-soft:#eef4ff;
}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:radial-gradient(circle at 50% -10%,#edf3ff 0,#f7f9fc 36%,#f7f9fc 100%);
    color:var(--text);
    min-height:100vh;
}
.page{
    width:min(100% - 32px,980px);
    margin:0 auto;
    padding:58px 0 70px;
}
.header{
    text-align:center;
    margin-bottom:38px;
}
.title{
    font-size:clamp(27px,4vw,36px);
    line-height:1.2;
    letter-spacing:1px;
    font-weight:700;
    color:var(--text);
}
.month-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}
.month-card{
    position:relative;
    min-height:104px;
    padding:0 30px 0 34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(255,255,255,.96);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 4px 18px rgba(30,45,70,.045),0 1px 2px rgba(30,45,70,.03);
    cursor:pointer;
    overflow:hidden;
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.month-card::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;width:4px;
    background:transparent;
    transition:background .2s ease;
}
.month-card:hover{
    transform:translateY(-2px);
    border-color:#d7e1f2;
    box-shadow:0 10px 28px rgba(30,45,70,.09),0 2px 5px rgba(30,45,70,.04);
}
.month-card:hover::before{background:var(--accent)}
.month-card:active{transform:translateY(0)}
.month-content{
    display:flex;
    align-items:center;
    gap:20px;
}
.month-number{
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:17px;
    font-weight:700;
}
.month-name{
    font-size:23px;
    font-weight:650;
    letter-spacing:.5px;
    color:var(--text);
}
.arrow{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    color:#9aa5b5;
    background:#f7f9fc;
    font-size:21px;
    transition:all .2s ease;
}
.month-card:hover .arrow{
    color:var(--accent);
    background:var(--accent-soft);
    transform:translateX(2px);
}
.divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:10px 2px 2px;
    color:#a0a9b7;
    font-size:12px;
    letter-spacing:1px;
}
.divider::before,.divider::after{
    content:"";
    height:1px;
    flex:1;
    background:var(--line);
}
.interview-card{
    margin-top:0;
    border-color:#dbe4f4;
}
.interview-card .month-number{
    background:#f1f4f8;
    color:#596579;
    width:46px;
    font-size:13px;
}
.interview-card:hover::before{background:#596579}
.interview-card:hover .arrow{
    color:#596579;
    background:#f1f4f8;
}
.footer{
    text-align:center;
    margin-top:30px;
    color:#a2aab7;
    font-size:12px;
    letter-spacing:.5px;
}
@media(max-width:600px){
    .page{
        width:min(100% - 22px,980px);
        padding:38px 0 45px;
    }
    .header{margin-bottom:27px}
    .title{font-size:28px}
    .month-card{
        min-height:88px;
        padding:0 18px 0 22px;
        border-radius:14px;
    }
    .month-content{gap:14px}
    .month-number{
        width:40px;
        height:40px;
        border-radius:10px;
        font-size:15px;
    }
    .month-name{font-size:20px}
    .arrow{
        width:34px;
        height:34px;
        font-size:19px;
    }
}
</style>
</head>

<body>
<div class="page">

<header class="header">
    <h1 class="title">就職活動明細</h1>
</header>

<main class="month-list">

    <div class="month-card" onclick="openPDF('pdf/4月.pdf')">
        <div class="month-content">
            <div class="month-number">04</div>
            <div class="month-name">4月(4社)</div>
        </div>
        <div class="arrow">›</div>
    </div>

    <div class="month-card" onclick="openPDF('pdf/5月.pdf')">
        <div class="month-content">
            <div class="month-number">05</div>
            <div class="month-name">5月(14社)</div>
        </div>
        <div class="arrow">›</div>
    </div>

    <div class="month-card" onclick="openPDF('pdf/6月.pdf')">
        <div class="month-content">
            <div class="month-number">06</div>
            <div class="month-name">6月(12社)</div>
        </div>
        <div class="arrow">›</div>
    </div>

    <div class="month-card" onclick="openPDF('pdf/7月.pdf')">
        <div class="month-content">
            <div class="month-number">07</div>
            <div class="month-name">7月(18社)</div>
        </div>
        <div class="arrow">›</div>
    </div>

    <div class="month-card" onclick="openPDF('pdf/8月.pdf')">
        <div class="month-content">
            <div class="month-number">08</div>
            <div class="month-name">8月(23社)</div>
        </div>
        <div class="arrow">›</div>
    </div>

    <div class="month-card" onclick="openPDF('pdf/9月.pdf')">
        <div class="month-content">
            <div class="month-number">09</div>
            <div class="month-name">9月(23社)</div>
        </div>
        <div class="arrow">›</div>
    </div>

    <div class="divider">その他の資料</div>

    <div class="month-card interview-card" onclick="openPDF('pdf/面接会社.pdf')">
        <div class="month-content">
            <div class="month-number">資料</div>
            <div class="month-name">面接会社(5社)</div>
        </div>
        <div class="arrow">›</div>
    </div>

</main>


</div>

<script>
function openPDF(file){
    window.open(file,"_blank");
}
</script>
</body>
</html>
